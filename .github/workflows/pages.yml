name: Deploy site

# Builds the browser version and publishes it to GitHub Pages, so anyone can
# generate a poster with no account, no clone and no install.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "otfposter/**"
      - "assets/**"
      - "schedules/raw/**"
      - "scripts/build_site.py"
      - "scripts/smoke_site.py"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-pages.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.lock
      - run: |
          python -m pip install -r requirements-pages.lock
          python -m pip install --no-deps --no-build-isolation -e .

      # The site ships the real package, so if the package is broken the site
      # should not go out.
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser editor regressions
        run: node --test tests/*.test.cjs

      - run: python scripts/build_site.py
      - name: Install Chromium for the published-site smoke check
        run: python -m playwright install --with-deps chromium
      - name: Real browser, mobile, accessibility, and download checks
        run: python scripts/smoke_site.py --site site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
