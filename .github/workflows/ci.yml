name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-pages.lock
      - run: |
          python -m pip install -r requirements-pages.lock
          python -m pip install --no-deps --no-build-isolation -e .
      # No browser here: the suite renders HTML only, so it stays fast.
      - run: python -m pytest -q
      - name: Every committed schedule still validates
        run: python -m otfposter validate

  browser-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Editor state, controls, and application flow
        run: node --test tests/*.test.cjs

  built-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.lock
      - run: |
          python -m pip install -r requirements-pages.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - name: Real browser, mobile, accessibility, and download checks
        run: python scripts/smoke_site.py --site site
