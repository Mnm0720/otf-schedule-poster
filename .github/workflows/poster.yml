name: Build poster

# Three ways in:
#   1. Paste a new month's post straight into the Actions UI (workflow_dispatch).
#   2. Push/commit a file to schedules/raw/ and it renders on merge.
#   3. Open a PR touching a schedule -- renders a preview artifact, commits nothing.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (leave blank to infer from the text)"
        required: false
        type: string
      schedule_text:
        description: "Paste the monthly template post here"
        required: true
        type: string
      theme:
        description: "Theme of the month (orange chip)"
        required: false
        type: string
      tagline:
        description: "Italic line under the theme (inline HTML allowed)"
        required: false
        type: string
      commit:
        description: "Commit the generated poster back to the repo"
        required: false
        default: true
        type: boolean
      strict:
        description: "Fail if the parser or validator flags anything"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "schedules/**"
      - "otfposter/**"
      - "assets/**"
  pull_request:
    paths:
      - "schedules/**"
      - "otfposter/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: poster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

      # ---- pasted month (workflow_dispatch) ----------------------------
      # Inputs go through the environment, never through the command line:
      # interpolating them into `run:` would let a quote in a theme break the
      # script (or worse) rather than just render oddly.
      - name: Build from paste
        if: github.event_name == 'workflow_dispatch'
        env:
          SCHEDULE_TEXT: ${{ inputs.schedule_text }}
          IN_MONTH: ${{ inputs.month }}
          IN_THEME: ${{ inputs.theme }}
          IN_TAGLINE: ${{ inputs.tagline }}
          IN_STRICT: ${{ inputs.strict }}
        run: |
          printf '%s\n' "$SCHEDULE_TEXT" > /tmp/pasted.txt
          args=(build /tmp/pasted.txt --offline)
          if [ -n "$IN_MONTH" ];   then args+=(--month "$IN_MONTH"); fi
          if [ -n "$IN_THEME" ];   then args+=(--theme "$IN_THEME"); fi
          if [ -n "$IN_TAGLINE" ]; then args+=(--tagline "$IN_TAGLINE"); fi
          if [ "$IN_STRICT" = "true" ]; then args+=(--strict); fi
          python -m otfposter "${args[@]}"

      # ---- committed schedules (push / PR) -----------------------------
      - name: Render all schedules
        if: github.event_name != 'workflow_dispatch'
        run: python -m otfposter render --offline

      - name: Upload poster
        uses: actions/upload-artifact@v4
        with:
          name: otf-poster${{ github.event_name == 'pull_request' && '-preview' || '' }}
          path: |
            out/*.png
            out/*.html
          if-no-files-found: error

      - name: Commit generated files
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.commit)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out schedules assets
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Build OTF poster [skip ci]"
            git push
          fi
